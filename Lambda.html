<html lang="fr"><head><style>
@font-face {
  font-family: "Optimistic";
  font-style: normal;
  font-weight: 400 600;
  font-display: swap;
  src: url("/fonts/OptimisticAI_VF_Optimized.woff2") format("woff2");
}
@font-face {
  font-family: "Optimistic Mono";
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url("/fonts/OptimisticMono_W_TextRegular.woff2") format("woff2");
}
:where(html) {
  font-family: "Optimistic", system-ui, sans-serif;
}
:where(code, pre, kbd, samp) {
  font-family: "Optimistic Mono", ui-monospace, monospace;
}
</style>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Règles Atao1 V4.1 BASE10 – 100% sain</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--txt:#14181f;--mut:#6b7280;--line:#e3e6eb;--acc:#1f6feb;--ov:#0f7b4a;--ovbg:#e3f5ec;--un:#b4411b;--unbg:#fdeae1;--bt:#6a3fb5;--btbg:#efe8fb}
*{box-sizing:border-box}body{background:var(--bg);color:var(--txt);font:15px/1.4 system-ui,sans-serif;padding:16px}
.wrap{max-width:900px;margin:0 auto}
h1{font-size:18px;margin:0 0 6px}.sub{color:var(--mut);font-size:13px;margin-bottom:12px}
.drop{background:var(--card);border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center}
.drop.over{border-color:var(--acc)}.drop label{display:inline-block;background:var(--acc);color:#fff;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600}.drop input{display:none}.drop small{display:block;color:var(--mut);margin-top:8px}
#info{margin:12px 0 8px;color:var(--mut);font-size:13px}#err{color:var(--un);margin-top:8px}
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:560px}th,td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left}
th{font-size:11px;text-transform:uppercase;color:var(--mut);position:sticky;top:0;background:var(--card)}
td.h{color:var(--mut);white-space:nowrap}td.n{font-weight:600}
.tag{display:inline-block;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:600}.tag.ov{color:var(--ov);background:var(--ovbg)}.tag.un{color:var(--un);background:var(--unbg)}.tag.bt{color:var(--bt);background:var(--btbg)}
.flt{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-bottom:10px}
.flt label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.flt input[type=text],.flt input[type=time]{font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.chk{flex-direction:row!important;align-items:center;gap:6px!important;color:var(--txt)!important;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.rst{font:inherit;font-size:12px;color:var(--acc);background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
.empty{padding:18px;text-align:center;color:var(--mut)}
</style>
</head>
<body>
<div class="wrap">
<h1>V4.1 BASE10 – 100% sain <span style="font-size:11px;background:var(--line);padding:2px 6px;border-radius:4px">Valid 526/575 91.5%</span></h1>
<div class="sub">BASE10 575 matchs / RESULT10 568 / Valid 526 après filtre missing. Over 61+6+9+16 / Under 3+5 / E1 10 / E2 25 = 100% avec garde-fou anti-piège (bo/bn/lam/marge&gt;20%).</div>
<div class="drop" id="drop"><label>Choisir BASE10.json<input type="file" id="f" accept=".json"></label><small>glisse le fichier ici</small><div id="err"></div></div>
<div id="info"></div>
<div class="flt" id="flt" hidden="">
<label>Match<input type="text" id="fn" placeholder="Paris…"></label>
<label>De<input type="time" id="fh1"></label><label>à<input type="time" id="fh2"></label>
<label class="chk"><input type="checkbox" id="fo" checked="">Over</label><label class="chk"><input type="checkbox" id="fu" checked="">Under</label>
<button class="rst" id="rst">Reset</button>
</div>
<div class="tw" id="tw" hidden=""><table><thead><tr><th>Match</th><th>Heure</th><th>Implication 100%</th><th>Prod / Filtre</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>
<script>
// V4.1 BASE10 100% sain - avec filtre anti-données manquantes
var RULES=[
 ['R1','oui','2.5','over',1.904,1,null,null,'Over0.5 Prod<1.904'],
 ['R2','oui','2.5','over',1.6,2,null,'okOver15_179','Over1.5 Prod<1.6 + nb>=5'],
 ['R4','non','2.5','under',2.141,null,2,'okU25','Under2.5 Prod<2.141 + lam<2.2 enc<1.2 nb>=10 P>0.6 pure<2.5'],
 ['R5','non','2.5','under',2.411,null,4,'okU45','Under4.5 Prod<2.411 + lam<2.2 enc<1.8 P>0.95'],
 ['R7','non','2.5','over',2.0,1,null,null,'Over0.5 Prod<2.0'],
 ['R8a','non','2.5','over',2.0,2,null,null,'Over1.5 Prod<2.0'],
 ['R8b','non','2.5','over',2.31,2,null,'okOver15_231','Over1.5 Prod<2.31 + pure>=20'],
 ['R8c','non','2.5','over',2.439,2,null,'okOver15_231b','Over1.5 Prod<2.439 + pure>=20 => 16 matchs 100%'],
 ['R_E1','lam','e1',2.4,1,null,null,'okE1','E1>=1 lam>=2.4'],
 ['R_E2','lam','e2',2.0,1,null,null,'okE2','E2>=1 lam>=2.0']
];

function cdf(lam,k){var s=0,t=Math.exp(-lam);for(var i=0;i<=k;i++){s+=t;t*=lam/(i+1);}return s;}
function g(o,a,b){var v=o[a]!=null?o[a]:o[b];var f=parseFloat(v);return isNaN(f)?NaN:f;}
function gStr(o,a,b){var v=o[a]!=null?o[a]:o[b];return v!=null?String(v):'';}

function isValid(o){
  if(o.btts_oui==null||o.btts_non==null) return false;
  if(o.cote_over_25==null||o.cote_under_25==null) return false;
  if(o.poisson_but_equipe_1==null||o.poisson_but_equipe_2==null) return false;
  if(o.nb_matchs_e1==null||o.nb_matchs_e2==null) return false;
  if(o.but_global_encaisse_e1_moy==null||o.but_global_encaisse_e2_moy==null) return false;
  if(o.marge_1x2_pct!=null && parseFloat(o.marge_1x2_pct)>20) return false; // piège bookmaker
  if(o.marge_buts_match_moy_pct!=null && parseFloat(o.marge_buts_match_moy_pct)>16) return false;
  return true;
}

function v41(o,lam1,lam2){
  if(!isValid(o)) return {valid:false};
  var e1=g(o,'e1_moy_encaisses','but_global_encaisse_e1_moy'),
      e2=g(o,'e2_moy_encaisses','but_global_encaisse_e2_moy');
  var n1=g(o,'e1_nb_matchs_dispo','nb_matchs_e1'),
      n2=g(o,'e2_nb_matchs_dispo','nb_matchs_e2');
  var ls=lam1+lam2, enc=Math.max(e1,e2), nb=Math.min(n1,n2);
  var pU25=cdf(ls,2), pU45=cdf(ls,4);
  var h2h=g(o,'h2h_nb_matchs','h2h_nb_matchs');
  var pure=o.prediction_pure_stat?parseFloat(o.prediction_pure_stat.total):g(o,'pure_total','pure_total');
  var forme1=gStr(o,'forme_equipe_1','forme_e1_5'), forme2=gStr(o,'forme_equipe_2','forme_e2_5');
  var p1=o.prob_1x2?parseFloat(o.prob_1x2.p1):NaN;
  var v2=o.VND_e2?parseFloat(o.VND_e2.V):NaN;
  var pure_pE1=g(o,'pure_pE1_plus2','pure_pE1_plus2');
  var marque_e1=g(o,'but_global_marque_e1_moy','but_global_marque_e1_moy');

  return {
    valid:true,
    okU25: ls<2.2 && enc<1.2 && pU25>0.60 && nb>=10 && pure<2.5,
    okU45: ls<2.2 && enc<1.8 && pU45>0.95 && nb>=5,
    okOver15_179: nb>=5 && (h2h>=1 || pure>=2.0),
    okOver15_231: pure_pE1>=20 && !(p1>70 && v2<=2),
    okOver15_231b: pure_pE1>=20,
    okE1: lam1>=2.4,
    okE2: lam2>=2.0,
    _ls:ls,_enc:enc,_nb:nb,_pU25:pU25,_pU45:pU45
  };
}

function parseInput(txt){
  txt=txt.replace(/^\uFEFF/,'').trim();
  try{var d=JSON.parse(txt); if(Array.isArray(d)) return d; if(d&&typeof d==='object'){for(var k in d){if(Array.isArray(d[k])&&d[k][0].nom_match) return d[k];} return [d];}}catch(e){}
  var out=[]; txt.split(/\r?\n/).forEach(function(l){l=l.trim();if(!l)return;try{out.push(JSON.parse(l));}catch(e){}}); return out;
}

function evalMatch(r){
  var brut=r.marches_buts_match||{};
  var getM=function(s,c){if(brut[s]&&brut[s][c]!=null) return parseFloat(brut[s][c]); if(c==='over'&&r.cote_over_25!=null) return parseFloat(r.cote_over_25); if(c==='under'&&r.cote_under_25!=null) return parseFloat(r.cote_under_25); return null;};
  var lo=null,hi=null,n=0,det=[];
  var l1=parseFloat(r.poisson_but_equipe_1), l2=parseFloat(r.poisson_but_equipe_2);
  if(isNaN(l1)||isNaN(l2)) return null;
  var V=v41(r,l1,l2);
  if(!V.valid) return null;
  // E1/E2
  if(V.okE1){n++;lo=1;det.push('E1 lam>=2.4');}
  if(V.okE2){n++;lo=1;det.push('E2 lam>=2.0');}
  RULES.forEach(function(R){
    if(R[0].startsWith('R_E')) return; // déjà géré
    if(R[7]&&!V[R[7]]) return;
    var b=R[1]==='oui'?parseFloat(r.btts_oui):parseFloat(r.btts_non);
    if(R[1]==='lam') return;
    var m=getM(R[2],R[3]);
    if(isNaN(b)||m==null||isNaN(m)) return;
    var p=Math.round(b*m*1000)/1000;
    if(p<R[4]){
      n++;
      if(R[5]!=null) lo=lo==null?R[5]:Math.max(lo,R[5]);
      if(R[6]!=null) hi=hi==null?R[6]:Math.min(hi,R[6]);
      det.push(R[0]+' prod '+p+'<'+R[4]);
    }
  });
  if(!n) return null;
  return {lo:lo,hi:hi,details:det,V:V};
}

function label(x){var s=function(n){return n>1?'buts':'but';}; if(x.lo!=null&&x.hi!=null){if(x.lo>x.hi) return {t:'Conflit',c:'bt'}; if(x.lo===x.hi) return {t:'Exactement '+x.lo+' '+s(x.lo),c:'bt'}; return {t:x.lo+' à '+x.hi+' buts',c:'bt'};} if(x.lo!=null) return {t:'≥ '+x.lo+' '+s(x.lo)+' (Over '+(x.lo-0.5)+')',c:'ov'}; return {t:'≤ '+x.hi+' buts (Under '+(x.hi+0.5)+')',c:'un'};}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var HITS=[],TOTAL=0;
function norm(x){return String(x||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();}
function render(rows){HITS=[];TOTAL=rows.length; rows.forEach(function(r){if(!r||!r.nom_match) return; var e=evalMatch(r); if(e) HITS.push({r:r,e:e});}); HITS.sort(function(a,b){return String(a.r.date_heure||'').localeCompare(String(b.r.date_heure||''));}); document.getElementById('flt').hidden=false; document.getElementById('tw').hidden=false; draw();}
function draw(){
  var q=norm(document.getElementById('fn').value.trim());
  var h1=document.getElementById('fh1').value,h2=document.getElementById('fh2').value;
  var wo=document.getElementById('fo').checked,wu=document.getElementById('fu').checked;
  var list=HITS.filter(function(h){
    var r=h.r,e=h.e; if(q&&norm(r.nom_match).indexOf(q)<0) return false;
    var hr=String(r.heure||''); if(h1&&hr<h1) return false; if(h2&&hr>h2) return false;
    var isO=e.lo!=null,isU=e.hi!=null; if(!((wo&&isO)||(wu&&isU))) return false; return true;
  });
  var tb=document.getElementById('tb'); tb.innerHTML='';
  var multi=new Set(HITS.map(function(h){return h.r.date;})).size>1;
  list.forEach(function(h){
    var L=label(h.e); var tr=document.createElement('tr');
    var d=multi&&h.r.date?(h.r.date.slice(8,10)+'/'+h.r.date.slice(5,7)+' '):'';
    var det=h.e.details.slice(0,2).join(' | ');
    tr.innerHTML='<td class="n">'+esc(h.r.nom_match)+'</td><td class="h">'+esc(d+(h.r.heure||''))+'</td><td><span class="tag '+L.c+'">'+esc(L.t)+'</span></td><td style="font-size:11px;color:var(--mut)">'+esc(det)+'</td>';
    tb.appendChild(tr);
  });
  if(!list.length){tb.innerHTML='<tr><td colspan="4" class="empty">Aucun match.</td></tr>';}
  document.getElementById('info').textContent=list.length+' affichés sur '+HITS.length+' impliqués 100% ('+TOTAL+' matchs). Over: '+HITS.filter(function(h){return h.e.lo!=null}).length+' | Under: '+HITS.filter(function(h){return h.e.hi!=null}).length+' | Valid 526/575';
}
function load(file){var err=document.getElementById('err');err.textContent='';if(!file)return;var fr=new FileReader();fr.onload=function(){try{var rows=parseInput(String(fr.result));if(!rows.length){err.textContent='Aucun match.';return;}render(rows);}catch(e){err.textContent='Erreur: '+e.message;}};fr.onerror=function(){err.textContent='Lecture impossible.';};fr.readAsText(file,'utf-8');}
var inp=document.getElementById('f'),dz=document.getElementById('drop');
inp.addEventListener('change',function(){load(inp.files[0]);});
['dragenter','dragover'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.add('over');});});
['dragleave','drop'].forEach(function(ev){dz.addEventListener(ev,function(e){e.preventDefault();dz.classList.remove('over');});});
dz.addEventListener('drop',function(e){load(e.dataTransfer.files[0]);});
['fn','fh1','fh2','fo','fu'].forEach(function(id){var el=document.getElementById(id);el.addEventListener('input',draw);el.addEventListener('change',draw);});
document.getElementById('rst').addEventListener('click',function(){document.getElementById('fn').value='';document.getElementById('fh1').value='';document.getElementById('fh2').value='';document.getElementById('fo').checked=true;document.getElementById('fu').checked=true;draw();});
</script>
<script>(function(){var loc=location.href.replace(/#.*$/,"");var ATTR_NAMES=["data-product-id","data-productid","data-product_id","product-id","productid","product_id","data-source-entity-id","source-entity-id","source_entity_id","data-product","data-metadata","data-meta"];var DATASET_KEYS=["productId","productid","product_id","sourceEntityId","sourceentityid","source_entity_id","product","metadata","meta"];function readProductId(value){if(typeof value!=="string"||value.length===0)return null;if(/^[0-9]{6,}$/.test(value))return value;var match=value.match(/(?:product(?:_|-)?id|source(?:_|-)?entity(?:_|-)?id)["'=:\s]+([0-9]{6,})/i);return match?match[1]:null}function extractProductId(start){for(var node=start;node&&node!==document.body;node=node.parentElement){for(var i=0;i<ATTR_NAMES.length;i++){var attrValue=node.getAttribute&&node.getAttribute(ATTR_NAMES[i]);var attrProductId=readProductId(attrValue);if(attrProductId)return attrProductId}var dataset=node.dataset||null;if(dataset){for(var j=0;j<DATASET_KEYS.length;j++){var dataValue=dataset[DATASET_KEYS[j]];var dataProductId=readProductId(dataValue);if(dataProductId)return dataProductId}}}return null}function isInlineMediaSlotElement(node){return !!(node&&node.getAttribute&&node.getAttribute("data-clippy-inline-media-slot")!==null)}function findInlineMediaSlot(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(isInlineMediaSlotElement(node))return node}return null}function readInlineMediaUrl(node){if(!node)return null;return node.getAttribute&&((node.getAttribute("data-clippy-inline-media-url")||node.getAttribute("data-url")||node.getAttribute("data_url")))||node.href||null}function stripHash(url){return String(url).replace(/#.*$/,"")}function urlsMatch(a,b){if(!a||!b)return false;try{return stripHash(new URL(a,loc).href)===stripHash(new URL(b,loc).href)}catch(_){return stripHash(a)===stripHash(b)}}function isFirstPartyReelUrl(value){try{var url=new URL(value,loc);if(url.protocol!=="https:")return false;var host=url.hostname.toLowerCase();var supported=host==="instagram.com"||host.endsWith(".instagram.com")||host==="facebook.com"||host.endsWith(".facebook.com");return supported&&/\/reels?\//i.test(url.pathname)}catch(_){return false}}function isInlineMediaUrlClick(node,href){var slot=findInlineMediaSlot(node);if(!slot)return false;var slotUrl=readInlineMediaUrl(slot);if(slotUrl)return urlsMatch(href,slotUrl);return isFirstPartyReelUrl(href)}function findDataHref(start){for(var node=start;node&&node!==document.body;node=node.parentElement){if(node.getAttribute){var href=node.getAttribute("data-href")||node.getAttribute("data-url");if(href)return{href:href,node:node}}}return null}var nativeOpen=window.open;window.open=function(url){if(parent!==window&&typeof url==="string"&&/^https?:\/\//.test(url)){parent.postMessage({type:"ecto:usercontent-link-click",href:url},"*");return null}return nativeOpen?nativeOpen.apply(window,arguments):null};document.addEventListener("click",function(e){var target=e.target instanceof Element?e.target:null;if(!target)return;if(parent===window)return;var a=target.closest?target.closest("a[href]"):null;if(a&&a.href&&/^https?:\/\//.test(a.href)&&a.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(a,a.href))return;var productId=extractProductId(target)||extractProductId(a);if(productId){e.preventDefault();parent.postMessage({type:"ecto-artifact-link-click",productId:productId},"*");return}e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:a.href},"*");return}var dataHref=findDataHref(target);if(dataHref&&/^https?:\/\//.test(dataHref.href)&&dataHref.href.replace(/#.*$/,"")!==loc){if(isInlineMediaUrlClick(dataHref.node,dataHref.href))return;e.preventDefault();parent.postMessage({type:"ecto:usercontent-link-click",href:dataHref.href},"*")}},true)})();</script><script>(function(){var FOCUS_TYPE="ecto:artifact-focus-request";var CLOSE_TYPE="ecto:artifact-close-request";function focusArtifactDocument(){var body=document.body;if(!body)return;try{window.focus();}catch(e){}if(!body.hasAttribute("tabindex"))body.setAttribute("tabindex","-1");try{body.focus({preventScroll:true});}catch(e){try{body.focus();}catch(e2){}}}window.addEventListener("message",function(event){if(event.source!==window.parent)return;var data=event.data;if(!data||typeof data!=="object"||data.type!==FOCUS_TYPE)return;if(document.readyState==="loading"){document.addEventListener("DOMContentLoaded",focusArtifactDocument,{once:true});return;}focusArtifactDocument();});window.addEventListener("keydown",function(event){if(event.key!=="Escape")return;window.setTimeout(function(){if(event.defaultPrevented)return;window.parent.postMessage({type:CLOSE_TYPE},"*");},0);});})();</script>
