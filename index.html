<html lang="fr"><head><style>

<style>
:root{--bg:#08090c;--panel:#12151a;--input:#1e242f;--border:#232830;--hi:#e7ecf3;--mid:#9aa5b1;--dim:#5c6773;--blue:#3fa9f5;--green:#3ecf6e;--amber:#f5a623;--red:#ff4757;--purple:#a78bfa;--mono:Consolas,monospace}

body{font-family:var(--mono);background:var(--bg);color:var(--hi);min-height:100vh;display:flex;flex-direction:column}
.top{padding:16px 20px;background:linear-gradient(180deg,var(--panel),#0c0e12);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}

.faible-badge{color:var(--amber);font-weight:900;font-size:9px}

.rang-badge{background:rgba(255,215,0,.10);border:1px solid rgba(255,215,0,.30);color:#ffdb70;padding:2px 6px;border-radius:14px;font-weight:900;font-size:8.5px;white-space:nowrap}
.lambda-line{font-size:9px;white-space:nowrap;background:rgba(63,169,245,.07);border:1px solid rgba(63,169,245,.18);padding:3px 6px;border-radius:5px;display:inline-block}
.lambda-m{color:var(--amber);font-weight:900} .lambda-e1{color:var(--green);font-weight:900} .lambda-e2{color:var(--blue);font-weight:900}
.verdict{font-weight:900;padding:3px 8px;border-radius:6px;display:inline-block;min-width:80px;text-align:center;font-size:9px;text-transform:uppercase}
.v-e1under{background:linear-gradient(135deg,rgba(62,207,110,.2),rgba(52,211,153,.15));color:var(--green);border:1px solid rgba(62,207,110,.4)}
.v-e2under{background:linear-gradient(135deg,rgba(63,169,245,.2),rgba(52,152,219,.15));color:var(--blue);border:1px solid rgba(63,169,245,.4)}
.v-mover{background:linear-gradient(135deg,rgba(245,166,35,.2),rgba(255,215,0,.15));color:var(--amber);border:1px solid rgba(245,166,35,.4)}
.sep{color:var(--dim);font-weight:400}
.debug{padding:10px 20px;background:rgba(255,71,87,.08);border-bottom:1px solid var(--border);font-size:11px;color:var(--red);display:none;white-space:pre-wrap}
@media(max-width:768px){
  .wrap{padding:6px}
  .cards{gap:6px}
  .match-card{padding:6px;gap:4px}
  .line{font-size:8.5px;gap:3px}
  .line1{font-size:9px}
  .line2{font-size:8px}
  .line3{font-size:8px}
  .line4{font-size:8px}
  .heure{min-width:38px;font-size:9px;padding:2px 5px}
  .match{font-size:10px}
  .comp-badge,.pays-badge,.marge-min-badge,.marche-min-badge,.cote-min-badge,.marge-25-badge,.rang-badge{font-size:8px;padding:1.5px 5px}
  .verdict{min-width:70px;font-size:8.5px;padding:2px 6px}
  .lambda-line{font-size:8px;padding:2px 5px}
}
</style>

<label>Marge 2.5 seuil<select id="f-m25-seuil"><option value="">Tous seuils</option><option value="6">&lt; 6</option><option value="7">&lt; 7</option><option value="8">&lt; 8</option><option value="9">&lt; 9</option><option value="10">&lt; 10</option><option value="11">&lt; 11</option><option value="12">&lt; 12</option><option value="13">&lt; 13</option><option value="14">&lt; 14</option><option value="15">&lt; 15</option><option value="16">&lt; 16</option><option value="17">&lt; 17</option><option value="18">&lt; 18</option><option value="19">&lt; 19</option><option value="20">&lt; 20</option></select></label>

<script>
let grouped={};
let allFilteredCache=[];
function getNom(o){ return o.nom_match || ((o.equipe1||'E1')+' - '+(o.equipe2||'E2')); }
function fmt2(v){ if(v==null||isNaN(v)) return '-'; let n=parseFloat(v); if(isNaN(n)) return '-'; return n.toFixed(2); }
function fmtPct(v){ if(v==null||isNaN(v)) return '-'; let n=parseFloat(v); if(isNaN(n)) return '-'; return n.toFixed(1)+'%'; }
function buildGrouped(all){ grouped={}; all.forEach(function(o){ let k=o.matchId||o.nom_match; if(!grouped[k]) grouped[k]=[]; grouped[k].push(o); }); }

function getCompetition(first){
  let c = first.competition || first.tournament || first.league || first.ligue || first.competition_name || '';
  return c || '-';
}
function getPays(first){
  let p = first.pays || first.country || first.pays_nom || first.country_name || '';
  return p || '-';
}
function getCompText(first){
  let comp=getCompetition(first);
  let pays=getPays(first);
  if(comp!=='-' && pays!=='-') return comp+' - '+pays;
  if(comp!=='-') return comp;
  if(pays!=='-') return pays;
  return '-';
}

function getPerSeuil(first, type){
  // type: 'match', 'e1', 'e2'
  if(type==='match'){
    return first.marches_buts_match || (first.marges_completes && first.marges_completes.match && first.marges_completes.match.per_seuil) || {};
  } else if(type==='e1'){
    return first.marches_buts_equipe_1 || (first.marges_completes && first.marges_completes.equipe1 && first.marges_completes.equipe1.per_seuil) || {};
  } else if(type==='e2'){
    return first.marches_buts_equipe_2 || (first.marges_completes && first.marges_completes.equipe2 && first.marges_completes.equipe2.per_seuil) || {};
  }
  return {};
}

function getMinMarge(first){
  // Nouvelle logique : choisir plus petite cote entre over/under pour le seuil min
  let candidates=[];
  function addCandidate(minObj, perDict, label){
    if(!minObj || minObj.pct==null) return;
    let pct=parseFloat(minObj.pct);
    if(isNaN(pct)) return;
    let seuil = minObj.seuil!=null ? String(minObj.seuil) : null;
    // si seuil pas dans minObj, essayer de le déduire de marche
    if(!seuil && minObj.marche){
      let m=minObj.marche.match(/([0-9]+\.?[0-9]*)/);
      if(m) seuil=m[1];
    }
    if(!seuil) return;
    let entry = perDict ? perDict[seuil] : null;
    // si pas trouvé, chercher avec parseFloat key
    if(!entry && perDict){
      // try float match
      let keys=Object.keys(perDict);
      for(let k of keys){ if(parseFloat(k)===parseFloat(seuil)){ entry=perDict[k]; seuil=k; break; } }
    }
    let over = entry ? entry.over : null;
    let under = entry ? entry.under : null;
    let chosenDir=null, chosenCote=null;
    if(over!=null && under!=null){
      let ov=parseFloat(over), un=parseFloat(under);
      if(!isNaN(ov) && !isNaN(un)){
        if(ov < un){ chosenDir='over'; chosenCote=over; }
        else { chosenDir='under'; chosenCote=under; }
      }
    } else if(over!=null){ chosenDir='over'; chosenCote=over; }
    else if(under!=null){ chosenDir='under'; chosenCote=under; }
    // si pas de cotes, fallback sur marche existante
    let marche;
    if(chosenDir){
      marche = label+' '+chosenDir+'('+seuil+')';
    } else {
      marche = minObj.marche || (label+' over('+seuil+')');
      // essayer deviner dir depuis marche
      if(marche.toLowerCase().indexOf('under')!==-1) chosenDir='under';
      else chosenDir='over';
    }
    candidates.push({pct:pct, seuil:seuil, marche:marche, label:label, over:over, under:under, chosenDir:chosenDir, chosenCote:chosenCote, perDict:perDict});
  }

  addCandidate(first.marge_match_min, getPerSeuil(first,'match'), 'Match');
  addCandidate(first.marge_e1_min, getPerSeuil(first,'e1'), 'E1');
  addCandidate(first.marge_e2_min, getPerSeuil(first,'e2'), 'E2');

  if(candidates.length===0 && first.marges_completes){
    try{
      let m=first.marges_completes.match;
      if(m && m.marge_min) addCandidate(m.marge_min, m.per_seuil, 'Match');
      let e1=first.marges_completes.equipe1;
      if(e1 && e1.marge_min) addCandidate(e1.marge_min, e1.per_seuil, 'E1');
      let e2=first.marges_completes.equipe2;
      if(e2 && e2.marge_min) addCandidate(e2.marge_min, e2.per_seuil, 'E2');
    }catch(e){}
  }

  // fallback si toujours vide : chercher min global dans tous les seuils
  if(candidates.length===0){
    let allPer = [ {per:getPerSeuil(first,'match'), label:'Match'}, {per:getPerSeuil(first,'e1'), label:'E1'}, {per:getPerSeuil(first,'e2'), label:'E2'} ];
    for(let item of allPer){
      let per=item.per;
      for(let k in per){
        let v=per[k];
        if(v && v.marge_pct!=null){
          addCandidate({pct:v.marge_pct, seuil:k, marche:item.label+' over('+k+')'}, per, item.label);
        }
      }
    }
  }

  if(candidates.length===0) return null;
  candidates.sort(function(a,b){ return a.pct-b.pct; });
  return candidates[0];
}

function getMarge25(first){
  let per = first.marches_buts_match;
  if(per && per['2.5'] && per['2.5'].marge_pct!=null) return parseFloat(per['2.5'].marge_pct);
  if(first.marges_completes && first.marges_completes.match && first.marges_completes.match.per_seuil && first.marges_completes.match.per_seuil['2.5']){
    let v=first.marges_completes.match.per_seuil['2.5']; if(v.marge_pct!=null) return parseFloat(v.marge_pct);
  }
  if(first.marge_buts_match_moy_pct!=null) return parseFloat(first.marge_buts_match_moy_pct);
  if(first.marge_match_moy!=null) {
    if(typeof first.marge_match_moy==='object' && first.marge_match_moy.pct!=null) return parseFloat(first.marge_match_moy.pct);
    if(typeof first.marge_match_moy==='number') return first.marge_match_moy;
  }
  return null;
}

function getVerdictForMatch(first){
  try{
    let e1=(first.nom_match||'').split(' - ')[0]||first.equipe1||'E1';
    let e2=(first.nom_match||'').split(' - ')[1]||first.equipe2||'E2';
    let r1=first.rang_equipe_1, r2=first.rang_equipe_2;
    let pureX1=first.pure_xE1!=null?first.pure_xE1:(first.prediction_pure_stat?first.prediction_pure_stat.xE1:null);
    let pureX2=first.pure_xE2!=null?first.pure_xE2:(first.prediction_pure_stat?first.prediction_pure_stat.xE2:null);
    let pois1=first.poisson_but_equipe_1, pois2=first.poisson_but_equipe_2;
    let cote1=first.cote_c1, cote2=first.cote_c2;
    let moyMarq1=first.e1_moy_marques!=null?first.e1_moy_marques:first.but_global_marque_e1_moy;
    let moyMarq2=first.e2_moy_marques!=null?first.e2_moy_marques:first.but_global_marque_e2_moy;
    let moyEnc1=first.e1_moy_encaisses!=null?first.e1_moy_encaisses:first.but_global_encaisse_e1_moy;
    let moyEnc2=first.e2_moy_encaisses!=null?first.e2_moy_encaisses:first.but_global_encaisse_e2_moy;
    let f1=first.forme_equipe_1||'', f2=first.forme_equipe_2||'';
    function countV(s){ let m=s.match(/V/g); return m?m.length:0; }
    let v1=countV(f1), v2=countV(f2);
    function strength(r,pureX,pois,cote,moyMarq,moyEnc,vForm){
      let s=0;
      if(r!=null) s+=(30-r)*1.2;
      if(pureX!=null) s+=pureX*3.5;
      if(pois!=null) s+=pois*2.2;
      if(moyMarq!=null) s+=moyMarq*2.5;
      if(moyEnc!=null) s-=moyEnc*1.8;
      if(cote!=null){ if(cote<1.4) s+=6; else if(cote<1.8) s+=4; else if(cote<2.2) s+=2; else if(cote>3.5) s-=4; else if(cote>5) s-=6; }
      if(vForm!=null) s+=vForm*1.2;
      return s;
    }
    let str1=strength(r1,pureX1,pois1,cote1,moyMarq1,moyEnc1,v1);
    let str2=strength(r2,pureX2,pois2,cote2,moyMarq2,moyEnc2,v2);
    let weakTeam = str1<str2 ? 'e1' : 'e2';
    let strongTeam = weakTeam==='e1' ? 'e2' : 'e1';
    let weakName = weakTeam==='e1'?e1:e2;
    let weakMoy = weakTeam==='e1'?moyMarq1:moyMarq2;
    let weakPois = weakTeam==='e1'?pois1:pois2;
    let strongPois = weakTeam==='e1'?pois2:pois1;
    let weakPureX = weakTeam==='e1'?pureX1:pureX2;
    let weakCote = weakTeam==='e1'?cote1:cote2;
    let weakForme = weakTeam==='e1'?f1:f2;
    let fdWeak = weakTeam==='e1'?(first.forme_detail_e1||[]):(first.forme_detail_e2||[]);
    let allWeak = weakTeam==='e1'?(first.e1_matches_all||[]):(first.e2_matches_all||[]);
    let maxButHistorique = 0;
    fdWeak.forEach(function(m){ if((m.buts_pour||0)>maxButHistorique) maxButHistorique=m.buts_pour; });
    allWeak.forEach(function(m){ if((m.buts_pour||0)>maxButHistorique) maxButHistorique=m.buts_pour; });
    if(maxButHistorique===0 && weakMoy!=null && weakMoy>1.5) maxButHistorique=Math.ceil(weakMoy*1.8);
    let marchesWeak = weakTeam==='e1'?first.marches_buts_equipe_1:first.marches_buts_equipe_2;
    let validUnderThresholds = [];
    let bookMaxOver = 0;
    if(marchesWeak){
      Object.keys(marchesWeak).forEach(function(seuil){
        let data=marchesWeak[seuil];
        let underCote=data?data.under:null;
        let hasValidUnder = underCote!=null && underCote!=='' && underCote!=='-' && !isNaN(parseFloat(underCote));
        if(hasValidUnder){
          let s=parseFloat(seuil);
          if(!isNaN(s)){ validUnderThresholds.push(s); if(s>bookMaxOver) bookMaxOver=s; }
        }
      });
      validUnderThresholds.sort(function(a,b){ return a-b; });
    }
    let poissonMatch = first.poisson_but_match||0;
    let bttsProb = first.btts_p_oui_pct||0;
    let pureTotal = first.pure_total!=null?first.pure_total:(first.prediction_pure_stat?first.prediction_pure_stat.total:null);
    let bookMaxUnder = bookMaxOver;
    let canExceedBookMax = false;
    if(maxButHistorique > bookMaxUnder) canExceedBookMax=true;
    if(weakMoy!=null && weakMoy > bookMaxUnder) canExceedBookMax=true;
    if(weakPois!=null && weakPois > bookMaxUnder) canExceedBookMax=true;
    if(weakPureX!=null && weakPureX > bookMaxUnder) canExceedBookMax=true;
    if(fdWeak.some(function(m){ return (m.buts_pour||0) > bookMaxUnder; })) canExceedBookMax=true;
    let canScoreReasons=[];
    if(weakPois!=null && weakPois>=0.7) canScoreReasons.push('Poisson');
    if(weakMoy!=null && weakMoy>=0.8) canScoreReasons.push('Moy');
    if(fdWeak.filter(function(m){ return (m.buts_pour||0)>=1; }).length>=2) canScoreReasons.push('2/3');
    if(bttsProb>=45) canScoreReasons.push('BTTS');
    if(weakPureX!=null && weakPureX>=0.8) canScoreReasons.push('xG');
    let weakCanScore = canScoreReasons.length>0;
    let prob0_0 = 0;
    if(weakPois!=null && strongPois!=null && weakPois>0 && strongPois>0){ prob0_0 = Math.exp(-weakPois)*Math.exp(-strongPois); }
    else if(poissonMatch>0){ prob0_0 = Math.exp(-poissonMatch); }
    let positiveCount = canScoreReasons.length;
    let negativeCount = 0;
    if(weakMoy!=null && weakMoy<0.6) negativeCount++;
    if(weakPois!=null && weakPois<0.6) negativeCount++;
    if(weakMoy!=null && weakMoy<0.8 && weakPois!=null && weakPois<0.8) negativeCount++;
    let strongEnc = strongTeam==='e1'?moyEnc1:moyEnc2;
    if(strongEnc!=null && strongEnc<=0.6) negativeCount++;
    if(fdWeak.filter(function(m){return (m.buts_pour||0)===0;}).slice(0,2).length>=2) negativeCount++;
    if(fdWeak.filter(function(m){return (m.buts_pour||0)===0;}).length>=3) negativeCount++;
    if(weakForme && (weakForme.match(/D/g)||[]).length>=3) negativeCount++;
    if(weakCote!=null && weakCote>3.5) negativeCount++;
    if(prob0_0>0.08) negativeCount++;
    let weakCanScoreHighConf = (positiveCount>=3 && negativeCount<=1 && prob0_0<0.06 && weakMoy!=null && weakMoy>=0.9 && weakPois!=null && weakPois>=0.9);
    let openScore = (poissonMatch>=3?2:0) + (pureTotal!=null&&pureTotal>3?1:0);
    let isOpenMatch = poissonMatch>=3 || openScore>=2 || pureTotal>3.2;
    let isFermeMatch = poissonMatch<2.5 || pureTotal<2.0;
    let fdWeakNonZero = fdWeak.filter(function(m){ return !(m.buts_pour===0 && m.buts_contre===0); });
    let weakScoreInNonZero = fdWeakNonZero.filter(function(m){ return (m.buts_pour||0)>=1; }).length;
    let weakScoreRateNonZero = fdWeakNonZero.length>0 ? (weakScoreInNonZero/fdWeakNonZero.length*100) : 0;
    if(weakScoreRateNonZero<50) negativeCount++;
    let desiredThreshold = maxButHistorique>0 ? (maxButHistorique+0.5) : 1.5;
    let underThreshold;
    if(validUnderThresholds.length>0){
      let candidate = validUnderThresholds.find(function(t){ return t >= desiredThreshold; });
      if(candidate!=null){ underThreshold = candidate; }
      else { underThreshold = validUnderThresholds[validUnderThresholds.length-1]; }
    } else {
      underThreshold = desiredThreshold;
      if(underThreshold%1===0) underThreshold+=0.5;
      if(underThreshold<0.5) underThreshold=0.5;
      if(underThreshold>4.5) underThreshold=4.5;
    }
    if(bookMaxOver>0 && validUnderThresholds.includes(bookMaxOver) && bookMaxOver>underThreshold && bookMaxOver >= desiredThreshold){
      underThreshold = bookMaxOver;
    }
    let shouldUnderDirect = !canExceedBookMax;
    let shouldOver05 = false;
    if(!shouldUnderDirect){
      if(weakCanScoreHighConf && prob0_0<0.05 && (isOpenMatch || (bttsProb>60 && poissonMatch>2.6)) && weakScoreRateNonZero>=60){
        shouldOver05=true;
      } else if(weakCanScore && positiveCount>=3 && prob0_0<0.06 && !isFermeMatch && bttsProb>=60 && weakMoy>=1.0 && weakScoreRateNonZero>=65){
        shouldOver05=true;
      }
    }
    let verdict='', type='';
    if(shouldUnderDirect){
      if(weakTeam==='e1'){ verdict='E1 Under '+underThreshold; type='e1under'; } else { verdict='E2 Under '+underThreshold; type='e2under'; }
    } else if(shouldOver05){
      verdict='M Over 0.5'; type='mover';
    } else {
      if(weakTeam==='e1'){ verdict='E1 Under '+underThreshold; type='e1under'; } else { verdict='E2 Under '+underThreshold; type='e2under'; }
    }
    return {verdict:verdict, type:type, nomMatch:getNom(first), heure:first.heure||'00:00', weakName:weakName, prob0_0:prob0_0, maxHist:maxButHistorique, bookMax:bookMaxOver};
  }catch(e){
    return {verdict:'?', type:'unknown', nomMatch:getNom(first), heure:first.heure||'00:00', weakName:'?', prob0_0:0, maxHist:0, bookMax:0};
  }
}

function render(){
  try{

    let fHeure=document.getElementById('f-heure').value;

    let rows=[];
    for(let i=0;i<allLists.length;i++){
      let list=allLists[i];
      if(!list||!list[0]) continue;
      try{ let vd=getVerdictForMatch(list[0]); rows.push({first:list[0], vd:vd}); }catch(e){}
    }
    let filtered=rows.filter(function(r){
      if(fNom && r.vd.nomMatch.toLowerCase().indexOf(fNom)===-1) return false;
      if(fComp){
        let compText=getCompText(r.first).toLowerCase();
        if(compText.indexOf(fComp)===-1) return false;
      }
      if(fHeure){ let h=(r.vd.heure||'00:00').split(':')[0]; if(h!==fHeure) return false; }
      if(fVerdict && fVerdict!==r.vd.type) return false;
      if(fStats){
        let first=r.first;
        let hasM = first.poisson_but_match!=null;
        let hasE1 = first.poisson_but_equipe_1!=null;
        let hasE2 = first.poisson_but_equipe_2!=null;
        if(fStats==='complet' && !(hasM && hasE1 && hasE2)) return false;
        if(fStats==='e1e2' && !(hasE1 && hasE2)) return false;
        if(fStats==='has_any' && !(hasM || hasE1 || hasE2)) return false;
      }
      let m25 = getMarge25(r.first);
      if(fM25Interval){
        if(m25==null) return false;
        if(fM25Interval==='0-6'){ if(!(m25>=0 && m25<6)) return false; }

          let parts=fM25Interval.split('-');
          let lo=parseFloat(parts[0]), hi=parseFloat(parts[1]);

        let hasRang = (r1!=null && r1!=='' && r1!=='-' && r1!==0) || (r2!=null && r2!=='' && r2!=='-' && r2!==0);
        // si valeur = '-' ou 0 on considère sans rang selon données
        // Pour plus strict: si r1 et r2 existent et != '-', alors avec rang

        if(fRang==='sans' && hasRang) return false;
      }

        let marcheTxt = minMarge? minMarge.marche : '-';
        let coteTxt = minMarge && minMarge.chosenCote!=null ? (' @'+minMarge.chosenCote+' ('+minMarge.chosenDir+')') : '';
        let m25Txt = marge25!=null ? fmtPct(marge25) : '-';
        let line3 = '<div class="line line3"><span class="marge-min-badge">MargeMin: '+minPct+'</span> <span class="sep">-</span> <span class="marche-min-badge">'+marcheTxt+'</span> '+ (minMarge && minMarge.chosenCote!=null ? '<span class="cote-min-badge">Cote min: '+minMarge.chosenCote+' '+minMarge.chosenDir+'</span>' : '') +' <span class="sep">-</span> <span class="marge-25-badge">Marge 2.5: '+m25Txt+'</span></div>';
        let lambdaLine = '<span class="lambda-line"><span class="lambda-m">λM:'+lambdaM+'</span> | <span class="lambda-e1">λE1:'+lambdaE1+'</span> | <span class="lambda-e2">λE2:'+lambdaE2+'</span></span>';
        let r1 = first.rang_equipe_1!=null ? first.rang_equipe_1 : (first.rang_e1!=null ? first.rang_e1 : (first.rang_equipe1!=null ? first.rang_equipe1 : '-'));
        let r2 = first.rang_equipe_2!=null ? first.rang_equipe_2 : (first.rang_e2!=null ? first.rang_e2 : (first.rang_equipe2!=null ? first.rang_equipe2 : '-'));
        let rangBadge = '<span class="rang-badge">#'+r1+' #'+r2+'</span>';
        let line4 = '<div class="line line4">'+lambdaLine+' <span class="verdict '+cls+'">'+vd.verdict+'</span> <span class="sep">-</span> '+rangBadge+'</div>';
        let card = '<div class="match-card">'+line1+line2+line3+line4+'</div>';
        let div=document.createElement('div');
        div.innerHTML=card;
        container.appendChild(div.firstChild);
      });
    }
    document.getElementById('stat-filtre').textContent=filtered.length+' matchs | '+filtered.filter(function(r){return r.vd.type==='e1under';}).length+' E1 | '+filtered.filter(function(r){return r.vd.type==='e2under';}).length+' E2 | '+filtered.filter(function(r){return r.vd.type==='mover';}).length+' M';
    document.getElementById('stat-global').textContent=rows.length+' matchs';
  }catch(e){ console.error(e); document.getElementById('debug').style.display='block'; document.getElementById('debug').textContent='Erreur render: '+e.message+' '+e.stack; }
}

async function parseFiles(files){
  let debug=document.getElementById('debug'); debug.style.display='block'; debug.textContent='Lecture '+files.length+' fichier(s)...';
  let all=[]; let total=0;
  try{
    for(let file of files){
      debug.textContent='Lecture '+file.name+'...';
      let text=await file.text();
      let c=0;
      text.split(/\r?\n/).forEach(function(line){ line=line.trim(); if(!line) return; try{ let obj=JSON.parse(line); if(obj.matchId||obj.nom_match){ all.push(obj); c++; } }catch(e){} });
      if(c===0){ try{ let arr=JSON.parse(text); if(Array.isArray(arr)) arr.forEach(function(o){ if(o.matchId||o.nom_match){ all.push(o); c++; } }); else if(arr.matchId||arr.nom_match){ all.push(arr); c++; } }catch(e){} }
      total+=c;
    }
    if(all.length>0){
      buildGrouped(all);
      allFilteredCache=Object.values(grouped);
      debug.textContent=total+' lignes, '+Object.keys(grouped).length+' matchs - OK';
      render();
      setTimeout(function(){debug.style.display='none';},3000);
    }else{ debug.textContent='Aucun match trouvé'; }
  }catch(err){ debug.textContent='Erreur: '+err.message; }
}
