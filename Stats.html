<style>

let data = [...demoData];

function norm(s){return s? s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim() : '';}
function timeToMin(t){ if(!t) return 0; const [h,m]=t.split(':').map(Number); return h*60+m; }

function splitStats(matches, team){
  if(!matches || !matches.length) return {g:{m:0,e:0,n:0,tm:0,te:0}, dom:{m:0,e:0,n:0,tm:0,te:0}, ext:{m:0,e:0,n:0,tm:0,te:0}, list:[]};
  let gM=0,gE=0, dM=0,dE=0,dN=0, xM=0,xE=0,xN=0;
  let first = team.split(' ')[0].toLowerCase();
  matches.forEach(mm=>{
    const isDom = mm.teamA.toLowerCase().includes(first) || norm(mm.teamA).includes(norm(first));
    const isExt = mm.teamB.toLowerCase().includes(first) || norm(mm.teamB).includes(norm(first));
    gM+=mm.buts_pour; gE+=mm.buts_contre;
    if(isDom && !isExt){ dM+=mm.buts_pour; dE+=mm.buts_contre; dN++; }
    else if(isExt && !isDom){ xM+=mm.buts_pour; xE+=mm.buts_contre; xN++; }
    else {
      if(mm.scoreA===mm.buts_pour){ dM+=mm.buts_pour; dE+=mm.buts_contre; dN++; }
      else { xM+=mm.buts_pour; xE+=mm.buts_contre; xN++; }
    }
  });
  const n=matches.length;
  return {
    g:{m:gM/n, e:gE/n, n:n, tm:gM, te:gE},
    dom:{m:dN?dM/dN:0, e:dN?dE/dN:0, n:dN, tm:dM, te:dE},
    ext:{m:xN?xM/xN:0, e:xN?xE/xN:0, n:xN, tm:xM, te:xE},
    list:matches
  };
}

function h2hStats(h2h, e1, e2){
  if(!h2h || !h2h.length) return {avgE1:0,avgE2:0,avgTot:0,avgDiff:0,n:0,scores:[],maxEcart:0,tE1:0,tE2:0};
  let tE1=0,tE2=0,tot=0,maxE=0,scores=[];
  h2h.forEach(m=>{
    const sA=m.scoreA ?? parseInt(m.score.split('-')[0]); const sB=m.scoreB ?? parseInt(m.score.split('-')[1]);
    const f1 = e1.split(' ')[0].toLowerCase();
    const aLow = m.teamA.toLowerCase(), bLow = m.teamB.toLowerCase();
    let e1g, e2g;
    if(aLow.includes(f1)){ e1g=sA; e2g=sB; } else if(bLow.includes(f1)){ e1g=sB; e2g=sA; } else { e1g=sA; e2g=sB; }
    tE1+=e1g; tE2+=e2g; tot+=sA+sB; maxE=Math.max(maxE, Math.abs(sA-sB));
    scores.push(`${m.teamA} ${sA}-${sB} ${m.teamB}`);
  });
  return {avgE1:tE1/h2h.length, avgE2:tE2/h2h.length, avgTot:tot/h2h.length, avgDiff:(tE1-tE2)/h2h.length, n:h2h.length, scores, maxEcart:maxE, tE1, tE2};
}

function predictPure(d){
  const s1 = splitStats(d.e1_matches_all||[], d.equipe1);
  const s2 = splitStats(d.e2_matches_all||[], d.equipe2);
  const h = h2hStats(d.h2h_all||[], d.equipe1, d.equipe2);
  const e1DomM = s1.dom.n ? s1.dom.m : s1.g.m;
  const e1DomE = s1.dom.n ? s1.dom.e : s1.g.e;
  const e2ExtM = s2.ext.n ? s2.ext.m : s2.g.m;
  const e2ExtE = s2.ext.n ? s2.ext.e : s2.g.e;
  let xE1 = (e1DomM + e2ExtE) / 2;
  let xE2 = (e2ExtM + e1DomE) / 2;
  if(s1.dom.n===0 && s1.ext.n===0){ xE1 = (s1.g.m + s2.g.e)/2; }
  if(s2.ext.n===0 && s2.dom.n===0){ xE2 = (s2.g.m + s1.g.e)/2; }
  if(h.n>0){ xE1 = xE1*0.75 + h.avgE1*0.25; xE2 = xE2*0.75 + h.avgE2*0.25; }
  xE1 = Math.max(0.1, xE1); xE2 = Math.max(0.1, xE2);
  const diff = xE1 - xE2; const total = xE1 + xE2;
  const predE1 = Math.round(xE1); const predE2 = Math.round(xE2); const predDiff = predE1 - predE2;
  function probaEcart(diffCible, diffReelle, soliditeDef){
    let base = 0;
    if(diffReelle >= diffCible - 0.3) base = 50 + (diffReelle - diffCible + 0.3)*30;
    else base = 30 + (diffReelle - diffCible)*10;
    base += soliditeDef*10;
    return Math.max(2, Math.min(90, Math.round(base)));
  }
  const solidE1 = 1 - Math.min(0.9, s1.g.e/3); const solidE2 = 1 - Math.min(0.9, s2.g.e/3);
  let pE1_2=0,pE1_3=0,pE2_2=0,pE2_3=0;
  if(diff>=0){
    pE1_2 = probaEcart(2, diff, solidE2); pE1_3 = probaEcart(3, diff, solidE2);
    pE2_2 = Math.max(2, 15 - diff*8); pE2_3 = Math.max(1, 8 - diff*5);
  } else {
    pE2_2 = probaEcart(2, -diff, solidE1); pE2_3 = probaEcart(3, -diff, solidE1);
    pE1_2 = Math.max(2, 15 + diff*8); pE1_3 = Math.max(1, 8 + diff*5);
  }
  if(h.maxEcart>=3){ if(h.avgDiff>0){ pE1_2+=10; pE1_3+=12; } else if(h.avgDiff<0){ pE2_2+=10; pE2_3+=12; } }
  const isComplete = (s1.g.n>0 && s2.g.n>0 && h.n>0);
  return {s1,s2,h,xE1,xE2,diff,total,predE1,predE2,predDiff,pE1_2,pE1_3,pE2_2,pE2_3,isComplete};
}

function render(){

  const ecartMin=parseInt(document.getElementById('ecartMin').value);
  const sortBy=document.getElementById('sortBy').value;
  const filterComplete=document.getElementById('filterComplete').checked;
  
  const minMin=timeToMin(heureMin); const maxMin=timeToMin(heureMax);
  
  let filtered = data.filter(d=>{
    if(q && !`${d.equipe1} ${d.equipe2} ${d.nom_match}`.toLowerCase().includes(q)) return false;
    const p=predictPure(d);
    if(filterComplete && !p.isComplete) return false;
    if(Math.abs(p.diff) < ecartMin) return false;
    const hm = timeToMin(d.heure);
    if(heureMin && heureMax && (hm < minMin || hm > maxMin)) return false;
    return true;
  });
  
  filtered.sort((a,b)=>{
    const pa=predictPure(a), pb=predictPure(b);
    if(sortBy==='heure') return timeToMin(a.heure) - timeToMin(b.heure);
    if(sortBy==='diff') return Math.abs(pb.diff) - Math.abs(pa.diff);
    if(sortBy==='complete') return (pb.isComplete?1:0) - (pa.isComplete?1:0);
    if(sortBy==='buts') return pb.s1.g.m - pa.s1.g.m;
    return 0;
  });

        </div>

        </div>
      </div>
      
      <div class="section">
        <div class="section-title">🎯 Prédiction pure stat</div>
        <div class="pred-box">
          <div class="pred-score">
            <div class="pred-team">${d.equipe1.slice(0,14)}<br><small>xG ${p.xE1.toFixed(2)}</small></div>

document.getElementById('fileInput').addEventListener('change', e=>{
  const files=e.target.files; let all=[]; let proms=[];
  for(let f of files){
    proms.push(new Promise(res=>{
      const r=new FileReader();
      r.onload=ev=>{
        ev.target.result.split('\n').filter(l=>l.trim()).forEach(l=>{ try{ const o=JSON.parse(l); if(o.matchId) all.push(o); }catch{} });
        res();
      };
      r.readAsText(f);
    }));
  }
  Promise.all(proms).then(()=>{ if(all.length){ data=all; render(); } });
});

  const blob=new Blob([csv],{type:'text/csv'}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download='pure_stat_mobile.csv'; a.click();
